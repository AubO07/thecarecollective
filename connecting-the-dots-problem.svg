<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="720" style="display:block;width:100%;height:auto" viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="problemTitle problemDesc">
  <title id="problemTitle">The problem: coordinated NHS practice and fragmented care support</title>
  <desc id="problemDesc">A steady blue NHS pathway shows specialists working together through monitoring, handovers and early intervention. Below it, a pale continuous high-amplitude wave represents lived experience while separate muted dots represent fragmented service contacts.</desc>
  <rect width="1040" height="720" rx="28" fill="#ffffff"/>
  <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif">
  <text x="70" y="58" fill="#e437a4" font-size="20" font-weight="800" letter-spacing="2">01 · THE PROBLEM</text>
  <text x="70" y="88" fill="#182d49" font-size="17">The NHS coordinates specialists around one patient. Care support is still fragmented.</text>

    <path d="M70 245 H970" stroke="#49a1f8" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="73" y="170" width="274" height="34" rx="17" fill="#eef7ff"/>
    <text x="210" y="193" text-anchor="middle" fill="#2879bd" font-size="16" font-weight="800">COORDINATED NHS PATHWAY</text>
    <g fill="#49a1f8"><circle cx="150" cy="245" r="10"/><circle cx="390" cy="245" r="10"/><circle cx="650" cy="245" r="10"/><circle cx="900" cy="245" r="10"/></g>
    <text x="150" y="284" text-anchor="middle" fill="#2879bd" font-size="14" font-weight="700">specialists together</text>
    <text x="390" y="284" text-anchor="middle" fill="#2879bd" font-size="14" font-weight="700">continuous monitoring</text>
    <text x="650" y="284" text-anchor="middle" fill="#2879bd" font-size="14" font-weight="700">safe handovers</text>
    <text x="900" y="284" text-anchor="middle" fill="#2879bd" font-size="14" font-weight="700">early intervention</text>

