<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="720" viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="problemTitle problemDesc">
  <title id="problemTitle">The problem: coordinated NHS practice and fragmented care support</title>
  <desc id="problemDesc">A steady blue NHS pathway shows specialists working together through monitoring, handovers and early intervention. Below it, a pale continuous high-amplitude wave represents lived experience while separate muted dots represent fragmented service contacts.</desc>
  <rect width="1040" height="720" rx="28" fill="#ffffff"/>
  <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif">
    <text x="70" y="58" fill="#e437a4" font-size="17" font-weight="800" letter-spacing="2">01 · THE PROBLEM</text>
    <text x="70" y="88" fill="#657388" font-size="17">The NHS coordinates specialists around one patient. Care support is still fragmented.</text>

    <path d="M70 245 H970" stroke="#49a1f8" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="73" y="170" width="274" height="34" rx="17" fill="#eef7ff"/>
    <text x="210" y="193" text-anchor="middle" fill="#2879bd" font-size="16" font-weight="800">COORDINATED NHS PATHWAY</text>
    <g fill="#49a1f8"><circle cx="150" cy="245" r="10"/><circle cx="390" cy="245" r="10"/><circle cx="650" cy="245" r="10"/><circle cx="900" cy="245" r="10"/></g>
    <text x="150" y="284" text-anchor="middle" fill="#2879bd" font-size="14" font-weight="700">specialists together</text>
    <text x="390" y="284" text-anchor="middle" fill="#2879bd" font-size="14" font-weight="700">continuous monitoring</text>
    <text x="650" y="284" text-anchor="middle" fill="#2879bd" font-size="14" font-weight="700">safe handovers</text>
    <text x="900" y="284" text-anchor="middle" fill="#2879bd" font-size="14" font-weight="700">early intervention</text>

    <path d="M105 470 C123 470 132 340 150 340 C168 340 177 520 195 520 C213 520 222 395 240 395 C258 395 267 320 285 320 C303 320 312 548 330 548 C348 548 357 430 375 430 C393 430 402 505 420 505" fill="none" stroke="#c9d7d2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <circle cx="105" cy="470" r="12" fill="#9db5ad"/><circle cx="150" cy="340" r="12" fill="#b3c3bd"/>
      <circle cx="195" cy="520" r="12" fill="#8fa69e"/><circle cx="240" cy="395" r="12" fill="#c0ccc8"/>
      <circle cx="285" cy="320" r="12" fill="#93afa5"/><circle cx="330" cy="548" r="12" fill="#aabeb7"/>
      <circle cx="375" cy="430" r="12" fill="#879e96"/><circle cx="420" cy="505" r="12" fill="#b8c8c2"/>
    </g>

    <text x="540" y="585" text-anchor="middle" fill="#657388" font-size="18" font-weight="700">Fragmented care and support</text>
    <text x="540" y="614" text-anchor="middle" fill="#7c8797" font-size="15">separate agencies · repeated information · missed handovers · preventable crisis</text>

    <path d="M70 660 H970" stroke="#b7c0ca" stroke-width="2"/>
    <path d="M970 660 l-10 -7 v14 z" fill="#b7c0ca"/>
    <text x="70" y="692" fill="#657388" font-size="16">Today</text>
    <text x="970" y="692" text-anchor="end" fill="#657388" font-size="16">Time →</text>
  </g>
</svg>
