    <g fill="#83e1c2">
      <circle cx="470" cy="505" r="12"/><circle cx="548" cy="475" r="12"/><circle cx="612" cy="400" r="12"/>
      <circle cx="686" cy="282" r="12"/><circle cx="756" cy="192" r="12"/><circle cx="850" cy="142" r="12"/><circle cx="970" cy="110" r="12"/>
