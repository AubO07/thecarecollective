    <path d="M456 142 V552" stroke="#e437a4" stroke-width="3"/>
    <circle cx="456" cy="505" r="8" fill="#e437a4"/>
    <text x="476" y="151" fill="#182d49" font-size="18" font-weight="800" letter-spacing="1.4">CONNECTING THE DOTS</text>
    <text x="476" y="179" fill="#657388" font-size="16">co-produced, coordinated support</text>

    <text x="260" y="585" text-anchor="middle" fill="#657388" font-size="18" font-weight="700">Fragmented support</text>
    <text x="260" y="614" text-anchor="middle" fill="#7c8797" font-size="15">some good outcomes · no dependable direction</text>
    <text x="735" y="585" text-anchor="middle" fill="#247558" font-size="18" font-weight="800">Employment · training · education</text>
    <text x="735" y="614" text-anchor="middle" fill="#657388" font-size="15">progress where wanted and appropriate</text>

