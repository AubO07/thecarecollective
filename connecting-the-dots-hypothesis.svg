  <title id="hypothesisTitle">The hypothesis: connected support creates a more dependable pathway</title>
  <desc id="hypothesisDesc">Separate sage dots form a high-amplitude fragmented trajectory. At the fuchsia Connecting the Dots intervention, they become a strong mint connected pathway towards employment, training or education.</desc>
