      <circle cx="195" cy="515" r="12" fill="#8fa69e"/><circle cx="240" cy="390" r="12" fill="#c0ccc8"/>
      <circle cx="285" cy="545" r="12" fill="#93afa5"/><circle cx="330" cy="420" r="12" fill="#aabeb7"/>
