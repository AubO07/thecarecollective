  <text x="70" y="88" fill="#182d49" font-size="17">Can coordinated support create a more dependable pathway?</text>

    <text x="520" y="134" text-anchor="middle" fill="#182d49" font-size="24" font-weight="800" letter-spacing=".8">CONNECTING THE DOTS</text>
    <text x="520" y="163" text-anchor="middle" fill="#657388" font-size="15">co-produced, coordinated support</text>

