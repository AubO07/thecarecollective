<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="720" viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hypothesisTitle hypothesisDesc">
  <title id="hypothesisTitle">The hypothesis: connected support creates a more dependable pathway</title>
  <desc id="hypothesisDesc">A high-amplitude fragmented pathway shows widely varying experiences. A minority of points cross economic break-even, but most do not. At the fuchsia Connecting the Dots intervention, a mint connected pathway rises towards employment, training or education.</desc>
