      <circle cx="235" cy="588" r="18"/><circle cx="520" cy="620" r="18"/><circle cx="805" cy="588" r="18"/>
      <circle cx="900" cy="348" r="18"/><circle cx="790" cy="142" r="18"/>
    </g>
