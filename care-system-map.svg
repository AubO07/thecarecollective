  <g fill="none" stroke="#d2d8df" stroke-width="3">
    <path d="M520 342 L520 104"/><path d="M500 348 L265 155"/><path d="M485 375 L130 348"/>
    <path d="M490 403 L250 575"/><path d="M520 412 L520 608"/><path d="M550 403 L790 575"/>
    <path d="M555 375 L900 348"/><path d="M540 348 L775 155"/>
  </g>
