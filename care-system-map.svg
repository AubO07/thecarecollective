      <text x="250" y="115">assessment · care · respite</text>
      <text x="112" y="318">wellbeing · recovery</text>
      <text x="235" y="658">rights · representation</text>
      <text x="520" y="702">local support · peer networks</text>
      <text x="805" y="658">flexibility · retention · return</text>
