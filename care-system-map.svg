<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="720" viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="systemMapTitle systemMapDesc">
  <title id="systemMapTitle">The services and decisions surrounding a carer and caree</title>
  <desc id="systemMapDesc">A carer and caree sit together at the centre. Grey lines connect them to the NHS, adult social care, mental health, legal and advocacy, community support, employers, education, benefits and housing.</desc>
