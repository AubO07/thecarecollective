<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="560" viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trajectoryTitle trajectoryDesc">
  <title id="trajectoryTitle">From fragmented support to connected progress and public value</title>
  <desc id="trajectoryDesc">Different muted dots fluctuate under fragmented support. At the Connecting the Dots intervention they become mint green and form a rising connected pathway. The pathway crosses a blue economic break-even line and continues into an area labelled net public value. The diagram is an illustrative hypothesis to be tested by the pilot.</desc>
  <rect width="1040" height="560" rx="28" fill="#ffffff"/>
  <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif">
    <text x="70" y="55" fill="#e437a4" font-size="17" font-weight="800" letter-spacing="2">ILLUSTRATIVE — TO BE TESTED</text>
    <text x="70" y="82" fill="#657388" font-size="17">Outcomes and economic contribution over time</text>

    <path d="M70 238 H970" stroke="#49a1f8" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="73" y="192" width="235" height="34" rx="17" fill="#eef7ff"/>
    <text x="190" y="215" text-anchor="middle" fill="#2879bd" font-size="16" font-weight="800">ECONOMIC BREAK-EVEN</text>

    <path d="M650 238 C686 214 714 180 746 155 C807 107 874 90 970 82 L970 238 Z" fill="#83e1c2" opacity=".18"/>
    <text x="760" y="55" text-anchor="middle" fill="#247558" font-size="18" font-weight="800">NET PUBLIC VALUE</text>
    <text x="760" y="82" text-anchor="middle" fill="#4f6f64" font-size="15">earnings · tax · lower crisis costs</text>

    <g fill="none" stroke="#d1d8de" stroke-width="2" stroke-dasharray="5 7">
      <path d="M105 377 L150 348 L195 391 L240 352 L285 403 L330 361 L375 386 L420 346"/>
    </g>
    <g>
      <circle cx="105" cy="377" r="11" fill="#9db5ad"/><circle cx="150" cy="348" r="11" fill="#b3c3bd"/>
      <circle cx="195" cy="391" r="11" fill="#8fa69e"/><circle cx="240" cy="352" r="11" fill="#c0ccc8"/>
      <circle cx="285" cy="403" r="11" fill="#93afa5"/><circle cx="330" cy="361" r="11" fill="#aabeb7"/>
      <circle cx="375" cy="386" r="11" fill="#879e96"/><circle cx="420" cy="346" r="11" fill="#b8c8c2"/>
    </g>
    <text x="260" y="449" text-anchor="middle" fill="#657388" font-size="18" font-weight="700">Fragmented support</text>
    <text x="260" y="476" text-anchor="middle" fill="#7c8797" font-size="15">activity without a dependable direction</text>

    <path d="M470 367 C525 351 556 329 588 297 C620 265 641 234 676 205 C727 162 778 129 842 106 C884 91 924 84 970 82" fill="none" stroke="#83e1c2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#83e1c2">
      <circle cx="470" cy="367" r="12"/><circle cx="548" cy="334" r="12"/><circle cx="612" cy="272" r="12"/>
      <circle cx="676" cy="205" r="12"/><circle cx="756" cy="143" r="12"/><circle cx="842" cy="106" r="12"/><circle cx="970" cy="82" r="12"/>
    </g>
    <path d="M456 117 V422" stroke="#e437a4" stroke-width="3"/>
    <circle cx="456" cy="367" r="8" fill="#e437a4"/>
    <text x="476" y="126" fill="#182d49" font-size="18" font-weight="800" letter-spacing="1.4">CONNECTING THE DOTS</text>
    <text x="476" y="153" fill="#657388" font-size="16">co-produced, coordinated support</text>
    <text x="720" y="449" text-anchor="middle" fill="#247558" font-size="18" font-weight="800">Connected pathway</text>
    <text x="720" y="476" text-anchor="middle" fill="#657388" font-size="15">stability · learning · work where wanted</text>

    <path d="M70 505 H970" stroke="#b7c0ca" stroke-width="2"/>
    <path d="M970 505 l-10 -7 v14 z" fill="#b7c0ca"/>
    <text x="70" y="535" fill="#657388" font-size="16">Today</text>
    <text x="970" y="535" text-anchor="end" fill="#657388" font-size="16">Time →</text>
  </g>
</svg>
