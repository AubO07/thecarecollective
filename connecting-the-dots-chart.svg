<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="720" viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trajectoryTitle trajectoryDesc">
  <title id="trajectoryTitle">From fragmented support to connected progress and public value</title>
  <desc id="trajectoryDesc">Many small separate sage dots form a high-amplitude wave before a central fuchsia Connecting the Dots intervention. At that point the dots become a strong continuous mint pathway, rising through economic break-even into potential public value. This is an illustrative hypothesis to be tested.</desc>
  <rect width="1040" height="720" rx="28" fill="#ffffff"/>
  <g font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif">
    <text x="70" y="58" fill="#e437a4" font-size="17" font-weight="800" letter-spacing="2">03 · THE OPPORTUNITY</text>
    <text x="70" y="88" fill="#657388" font-size="17">Can better outcomes, lower costs and higher revenues make improvement self-funding?</text>

    <text x="520" y="142" text-anchor="middle" fill="#e437a4" font-size="24" font-weight="800" letter-spacing=".8">WHAT HAPPENS WHEN WE CONNECT THE DOTS?</text>
    <text x="520" y="171" text-anchor="middle" fill="#657388" font-size="15">co-produced, coordinated support</text>

    <path d="M714 300 C747 238 800 185 855 150 C900 120 940 108 970 102 L970 300 Z" fill="#83e1c2" opacity=".18"/>
    <text x="847" y="224" text-anchor="middle" fill="#247558" font-size="18" font-weight="800">POTENTIAL PUBLIC VALUE</text>
    <text x="847" y="251" text-anchor="middle" fill="#3f695b" font-size="14">better outcomes · lower crisis costs</text>
    <text x="847" y="275" text-anchor="middle" fill="#3f695b" font-size="14">less fraud &amp; error · higher earnings &amp; tax</text>

    <path d="M70 500 C92 350 110 220 150 220 C190 220 185 550 240 550 C295 550 285 200 350 200 C415 200 405 545 475 545 C495 545 505 522 520 520" fill="none" stroke="#8fae9f" stroke-width="11" stroke-dasharray="0.1 26" stroke-linecap="round"/>

    <path d="M70 300 H970" stroke="#49a1f8" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="73" y="250" width="235" height="34" rx="17" fill="#eef7ff"/>
    <text x="190" y="273" text-anchor="middle" fill="#2879bd" font-size="16" font-weight="800">ECONOMIC BREAK-EVEN</text>
    <text x="260" y="585" text-anchor="middle" fill="#657388" font-size="18" font-weight="700">Fragmented support</text>
    <text x="260" y="614" text-anchor="middle" fill="#7c8797" font-size="15">some good outcomes · no dependable direction</text>

    <path d="M520 520 C575 512 620 468 655 415 C695 355 710 305 750 250 C800 185 855 150 910 125 C938 112 958 105 970 102" fill="none" stroke="#83e1c2" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#83e1c2">
      <circle cx="520" cy="520" r="12"/><circle cx="585" cy="500" r="12"/><circle cx="655" cy="415" r="12"/>
      <circle cx="715" cy="295" r="12"/><circle cx="780" cy="208" r="12"/><circle cx="855" cy="150" r="12"/><circle cx="970" cy="102" r="12"/>
    </g>
    <path d="M520 190 V560" stroke="#e437a4" stroke-width="6"/>
    <circle cx="520" cy="520" r="9" fill="#e437a4"/>
    <text x="735" y="585" text-anchor="middle" fill="#247558" font-size="18" font-weight="800">Connected pathway</text>
    <text x="735" y="614" text-anchor="middle" fill="#657388" font-size="15">stability · learning · work where wanted</text>

    <path d="M70 660 H970" stroke="#b7c0ca" stroke-width="2"/>
    <path d="M970 660 l-10 -7 v14 z" fill="#b7c0ca"/>
    <text x="70" y="692" fill="#657388" font-size="16">Today</text>
    <text x="970" y="692" text-anchor="end" fill="#657388" font-size="16">Time →</text>
  </g>
</svg>
